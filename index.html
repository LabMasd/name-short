<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>name.short — long names → tidy folder slugs</title>
<meta name="description" content="A tiny tool that turns long names into short, folder-safe slugs. Smart filler-drop, kebab/snake/camel, date stamps, ascii-safe. Free, runs in your browser.">
<meta property="og:title" content="name.short">
<meta property="og:description" content="Long names → tidy folder-safe slugs. Runs entirely in your browser.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23ced2a1'>.</text></svg>">
<style>
  :root{
    /* masd.cc design direction */
    --bg-primary:#1a1a1a;
    --bg-button:#252525;
    --bg-hover:#2a2a2a;
    --bg-input:#2a2a2a;
    --accent:#ced2a1;
    --accent-hover:#dde2b1;
    --text:#e0e0e0;
    --text-dim:#888;
    --border:#333;
    --danger:#e57373;
    --gap:8px;
    --padding:12px;
    --radius:6px;
    --mono:'SF Mono','Monaco','Consolas',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#111;color:var(--text);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    font-weight:500;
    font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;padding:40px 28px;display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:680px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:28px}
  h1{font-size:21px;font-weight:500;letter-spacing:-.5px;color:var(--accent)}
  h1 .dot,h1 .w{color:#fff}
  .sub{color:var(--text-dim);font-size:13px}

  .panel{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  label{display:block;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}

  textarea,input{
    width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:10px;font-size:13px;line-height:1.6;font-family:var(--mono);resize:vertical;
    transition:border-color .15s ease;
  }
  textarea{min-height:88px}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  textarea::placeholder,input::placeholder{color:var(--text-dim)}

  .controls{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px}
  .ctrl{display:flex;flex-direction:column;gap:6px}
  .ctrl label{margin:0}
  select,.num{
    background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius);padding:7px 9px;font-size:12px;font-family:inherit;cursor:pointer;
    transition:border-color .15s ease;
  }
  select:focus,.num:focus{outline:none;border-color:var(--accent)}
  .num{width:72px;font-family:var(--mono)}

  /* segmented toggle — accent on border/text, never as fill (per design direction) */
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .seg button{background:var(--bg-button);border:none;color:var(--text-dim);padding:7px 11px;font:inherit;font-size:12px;cursor:pointer;transition:all .15s ease}
  .seg button:hover{background:var(--bg-hover);color:var(--accent)}
  .seg button.on{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

  .chk{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text);user-select:none;font-size:12px}
  .chk input{width:auto;accent-color:var(--accent)}

  .out{margin-top:4px}
  .row{
    display:flex;align-items:center;gap:10px;padding:9px 11px;
    background:var(--bg-button);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;
    transition:border-color .15s ease;
  }
  .row:hover{border-color:var(--accent)}
  .row .orig{color:var(--text-dim);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
  .row .arrow{color:var(--border)}
  .row .short{color:#fff;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px}
  .row .len{color:var(--text-dim);font-size:10px;min-width:50px;text-align:right;font-family:var(--mono)}
  .row button{background:var(--bg-button);border:1px solid var(--border);color:var(--text-dim);border-radius:5px;padding:4px 9px;font:inherit;font-size:11px;cursor:pointer;transition:all .15s ease}
  .row button:hover{background:var(--bg-hover);border-color:var(--accent);color:var(--accent)}
  .row button:active{background:var(--accent);border-color:var(--accent);color:var(--bg-primary)}
  .row button.copied{border-color:var(--accent);color:var(--accent)}

  .bar{display:flex;gap:var(--gap);margin-top:12px}
  .bar button{
    flex:1;background:var(--bg-button);border:1px solid var(--border);color:var(--text-dim);
    border-radius:var(--radius);padding:10px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;
    transition:all .15s ease;
  }
  .bar button:hover{background:var(--bg-hover);border-color:var(--accent);color:var(--accent)}
  .bar button:active{transform:scale(.98);background:var(--accent);border-color:var(--accent);color:var(--bg-primary)}

  .empty{color:var(--text-dim);text-align:center;padding:20px;font-size:13px}

  footer{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);text-align:center;color:var(--text-dim);font-size:11px}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{color:var(--accent-hover)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>name<span class="dot">.</span><span class="w">short</span></h1>
    <span class="sub">long names → tidy folder-safe slugs</span>
  </header>

  <div class="panel">
    <label>Names — one per line</label>
    <textarea id="in" placeholder="Perfume Campaign Final Delivery 2026&#10;Client Brand Identity Working Files&#10;ChromeForge AE Extension Source"></textarea>

    <div class="controls">
      <div class="ctrl">
        <label>Case</label>
        <select id="case">
          <option value="kebab">kebab-case</option>
          <option value="snake">snake_case</option>
          <option value="camel">camelCase</option>
          <option value="pascal">PascalCase</option>
          <option value="lower">lowercase</option>
          <option value="upper">UPPERCASE</option>
        </select>
      </div>
      <div class="ctrl">
        <label>Strategy</label>
        <select id="strat">
          <option value="smart">smart (drop filler)</option>
          <option value="initials">initials</option>
          <option value="truncate">truncate words</option>
          <option value="vowels">drop vowels</option>
          <option value="full">full slug</option>
        </select>
      </div>
      <div class="ctrl">
        <label>Max length</label>
        <input class="num" id="max" type="number" min="0" value="24">
      </div>
      <div class="ctrl">
        <label>Date</label>
        <div class="seg" id="date">
          <button data-d="none" class="on">none</button>
          <button data-d="pre">pre</button>
          <button data-d="post">post</button>
        </div>
      </div>
      <div class="ctrl" style="justify-content:flex-end">
        <label class="chk"><input type="checkbox" id="ascii" checked> ascii only</label>
      </div>
    </div>
  </div>

  <div class="panel out">
    <label>Shortened</label>
    <div id="out"><div class="empty">Type some names above ↑</div></div>
    <div class="bar">
      <button id="copyAll">Copy all</button>
      <button id="sample">Load sample</button>
    </div>
  </div>

  <footer>
    runs entirely in your browser · nothing leaves this page ·
    <a href="https://masd.cc">masd.cc</a>
  </footer>
</div>

<script>
const FILLER = new Set(['a','an','the','of','for','and','or','to','in','on','with','at','by','from','final','draft','version','copy','new','working','files','file','project','folder','assets','asset','delivery','export','exports','master','client']);
const MONTH = ['01','02','03','04','05','06','07','08','09','10','11','12'];

const $ = s => document.querySelector(s);
let dateMode = 'none';

function today(){
  const d = new Date();
  return d.getFullYear()+MONTH[d.getMonth()]+String(d.getDate()).padStart(2,'0');
}

function tokenize(s){
  return s
    .replace(/[''`]/g,'')
    .split(/[^A-Za-z0-9]+/)
    .flatMap(w => w.replace(/([a-z0-9])([A-Z])/g,'$1 $2').split(' '))
    .filter(Boolean);
}

function stripAscii(s){
  return s.normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\x00-\x7F]/g,'');
}

function applyStrategy(words, strat){
  switch(strat){
    case 'initials':
      return words.map(w => w[0]).join('');
    case 'truncate':
      return words.map(w => w.length > 4 ? w.slice(0,4) : w);
    case 'vowels':
      return words.map(w => w.length > 3 ? w[0]+w.slice(1).replace(/[aeiou]/gi,'') : w);
    case 'smart':{
      let kept = words.filter(w => !FILLER.has(w.toLowerCase()) || /^\d+$/.test(w));
      if(kept.length === 0) kept = words;
      return kept;
    }
    case 'full':
    default:
      return words;
  }
}

function toCase(parts, mode){
  const arr = Array.isArray(parts) ? parts : [parts];
  const low = arr.map(w => w.toLowerCase());
  switch(mode){
    case 'kebab': return low.join('-');
    case 'snake': return low.join('_');
    case 'lower': return low.join('');
    case 'upper': return arr.map(w=>w.toUpperCase()).join('');
    case 'camel': return low.map((w,i)=> i? w[0].toUpperCase()+w.slice(1) : w).join('');
    case 'pascal': return low.map(w=> w[0].toUpperCase()+w.slice(1)).join('');
  }
}

function shorten(name){
  let s = name.trim();
  if(!s) return '';
  if($('#ascii').checked) s = stripAscii(s);
  let words = tokenize(s);
  if(words.length === 0) return '';

  const strat = $('#strat').value;
  const caseMode = $('#case').value;
  const result = applyStrategy(words, strat);

  let out = (strat === 'initials') ? toCase([result], caseMode) : toCase(result, caseMode);

  const max = parseInt($('#max').value) || 0;
  if(max > 0 && out.length > max) out = out.slice(0, max).replace(/[-_]+$/,'');

  const sep = caseMode==='snake'?'_':(caseMode==='kebab'?'-':'');
  if(dateMode === 'pre') out = today()+sep+out;
  if(dateMode === 'post') out = out+sep+today();

  return out;
}

function render(){
  const lines = $('#in').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const out = $('#out');
  if(lines.length === 0){ out.innerHTML = '<div class="empty">Type some names above ↑</div>'; return; }
  out.innerHTML = '';
  lines.forEach(line => {
    const sh = shorten(line);
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="orig" title="${line.replace(/"/g,'&quot;')}">${line}</span>
      <span class="arrow">→</span>
      <span class="short" title="${sh}">${sh}</span>
      <span class="len">${sh.length} ch</span>
      <button>copy</button>`;
    const btn = row.querySelector('button');
    btn.onclick = () => {
      navigator.clipboard.writeText(sh);
      btn.textContent = '✓'; btn.classList.add('copied');
      setTimeout(()=>{btn.textContent='copy';btn.classList.remove('copied')},900);
    };
    out.appendChild(row);
  });
}

$('#in').addEventListener('input', render);
['case','strat','max','ascii'].forEach(id => $('#'+id).addEventListener('change', render));
$('#date').addEventListener('click', e => {
  if(e.target.tagName!=='BUTTON') return;
  $('#date').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on'); dateMode = e.target.dataset.d; render();
});
$('#copyAll').onclick = () => {
  const lines = $('#in').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const txt = lines.map(shorten).join('\n');
  navigator.clipboard.writeText(txt);
  $('#copyAll').textContent = '✓ copied';
  setTimeout(()=>$('#copyAll').textContent='Copy all',900);
};
$('#sample').onclick = () => {
  $('#in').value = "Perfume Campaign Final Delivery 2026\nClient Brand Identity Working Files\nChromeForge AE Extension Source\nQ3 Social Media Content Calendar";
  render();
};
</script>
</body>
</html>
